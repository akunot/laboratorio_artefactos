name: Test Python Package from Nexus

on:
  push:
    branches:
      - deploy

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependency from Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_HOST: ec2-13-220-188-114.compute-1.amazonaws.com
        run: |
          pip install milib-ejemplo \
            --index-url "http://${NEXUS_USERNAME}:${NEXUS_PASSWORD}@${NEXUS_HOST}:8081/repository/artefactos/simple/" \
            --trusted-host ${NEXUS_HOST}
